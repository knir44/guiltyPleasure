services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gp_network

  mongodb:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gp_network

  tracker-service:
    build: ./services/tracker-service
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      - DEBUG=${DEBUG:-}
    volumes:
      - ./services/tracker-service/logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - gp_network
    restart: unless-stopped

  insights-service:
    build: ./services/insights-service
    depends_on:
      mongodb:
        condition: service_healthy
    env_file: .env
    environment:
      - DEBUG=${DEBUG:-}
    volumes:
      - ./services/insights-service/logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - gp_network
    restart: unless-stopped

  frontend:
    build: ./services/frontend
    volumes:
      - ./services/frontend/src:/app/src
      - ./services/frontend/index.html:/app/index.html
      - ./services/frontend/vite.config.js:/app/vite.config.js
    networks:
      - gp_network

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      tracker-service:
        condition: service_healthy
      insights-service:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - gp_network
    restart: unless-stopped

networks:
  gp_network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
